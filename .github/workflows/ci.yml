name: Verify static portfolio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck, test, build, and verify export
        run: npm run verify
      - name: Keep verified static export
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-out
          path: out
          if-no-files-found: error
